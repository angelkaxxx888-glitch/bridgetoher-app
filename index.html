<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>BridgeToHer — тест</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app {
            max-width: 400px;
            background: rgba(30,30,60,0.85);
            border-radius: 40px;
            padding: 24px;
            text-align: center;
        }
        button {
            background: #b49aff;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-size: 16px;
            color: white;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
        }
        .secondary-btn {
            background: transparent;
            border: 1px solid #b49aff;
        }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
<div class="app">
    <div class="logo-bth" style="font-size:48px;">BTH</div>
    <div class="logo-full">BridgeToHer</div>

    <!-- Страница 1 -->
    <div id="page1" class="page active">
        <h2>Мост к ней</h2>
        <p>Привет. Это приложение — мост между твоим настроением и его пониманием.</p>
        <p>🌸 Если нет партнёра — я поддержу тебя сам 🌸</p>
        <button onclick="goToPage(2)">✨ Начать</button>
        <button class="secondary-btn" onclick="goToPage(5)">🌙 Сразу к настроению</button>
    </div>

    <!-- Страница 2 (заглушка) -->
    <div id="page2" class="page">
        <button class="secondary-btn" onclick="goToPage(1)">← Назад</button>
        <h2>📲 Пригласить партнёра</h2>
        <button onclick="alert('Бот временно отключён')">📱 Открыть бота</button>
        <button onclick="goToPage(3)">⏰ Позже</button>
        <button onclick="goToPage(3)">Вперёд →</button>
    </div>

    <!-- Страница 3 (заглушка) -->
    <div id="page3" class="page">
        <button class="secondary-btn" onclick="goToPage(2)">← Назад</button>
        <h2>📋 Расскажи о себе</h2>
        <button onclick="goToPage(4)">💾 Сохранить и продолжить</button>
    </div>

    <!-- Страница 4 (заглушка) -->
    <div id="page4" class="page">
        <button class="secondary-btn" onclick="goToPage(3)">← Назад</button>
        <h2>📅 Календарь цикла</h2>
        <button onclick="goToPage(5)">Вперёд →</button>
    </div>

    <!-- Страница 5 (главная) -->
    <div id="page5" class="page">
        <button class="secondary-btn" onclick="goToPage(4)">← Календарь</button>
        <h2>🌸 Как ты сегодня?</h2>
        <div class="mood-buttons" style="display: flex; flex-wrap: wrap; gap: 8px;">
            <button class="mood-btn" data-mood="calm">😌 спокойно</button>
            <button class="mood-btn" data-mood="tender">🥰 нежность</button>
            <button class="mood-btn" data-mood="joy">😊 радость</button>
            <button class="mood-btn" data-mood="tired">😴 усталость</button>
        </div>
        <textarea id="dailyNote" placeholder="Заметка..." style="width:100%; margin:8px 0; padding:8px;"></textarea>
        <button id="sendDailyBtn">💌 Отправить</button>
        <button class="secondary-btn" onclick="goToPage(6)">⚙️ Настройки</button>
    </div>

    <!-- Страница 6 (заглушка) -->
    <div id="page6" class="page">
        <button class="secondary-btn" onclick="goToPage(5)">← Назад</button>
        <h2>⚙️ Настройки</h2>
        <button onclick="alert('Настройки сохранены')">💾 Сохранить</button>
    </div>
</div>

<script>
    function goToPage(pageNum) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
        document.getElementById('page'+pageNum).classList.add('active');
    }

    // Кнопки настроения
    document.querySelectorAll('.mood-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Отправка
    document.getElementById('sendDailyBtn').addEventListener('click', function() {
        const active = document.querySelector('.mood-btn.active');
        if (!active) {
            alert('Выбери настроение ❤️');
            return;
        }
        const mood = active.innerText;
        const note = document.getElementById('dailyNote').value;
        alert(`Отправлено: ${mood}\n${note ? 'Заметка: ' + note : ''}`);
    });
</script>
</body>
</html>
